<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/nlt-overlay.css">

    <title>NLT Pilot Relative</title>

    <style>
        .pilot-widget {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 820px;
        }

        .pilot-card {
            background: var(--overlay-card-bg);
            border: var(--overlay-border);
            border-radius: var(--overlay-radius);
            box-shadow: var(--overlay-shadow-soft);
            overflow: hidden;
        }

        .pilot-card-main {
            display: grid;
            grid-template-columns: 44px 72px 72px 1fr 110px 140px;
            align-items: center;
            height: 44px;
            padding: 0 6px;
        }

        .pilot-card-sub {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 26px;
            padding: 0 10px 0 50px;
            border-top: 1px solid rgba(217, 178, 63, 0.2);
            background: rgba(0, 0, 0, 0.3);
        }

        .direction {
            font-size: 18px;
            text-align: center;
        }

        .ahead-card .direction { color: var(--nlt-green); }
        .behind-card .direction { color: #e05a5a; }

        .position {
            font-size: 15px;
            font-weight: bold;
            color: var(--nlt-green);
            text-align: center;
        }

        .car-number {
            font-size: 13px;
            font-weight: bold;
            color: var(--nlt-gold);
            text-align: center;
        }

        .driver-name {
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 8px;
        }

        .gap {
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }

        .ahead-card .gap { color: var(--nlt-green); }
        .behind-card .gap { color: #e05a5a; }

        .sub-left {
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .lap-context {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        .pace-gap {
            font-size: 12px;
            font-weight: bold;
        }

        .pace-positive { color: var(--nlt-green); }
        .pace-negative { color: #e05a5a; }
        .pace-neutral  { color: rgba(255, 255, 255, 0.5); }

        .threat-badge {
            display: inline-block;
            padding: 2px 9px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .threat-alvo    { background: #A7E214; color: #111; }
        .threat-ameaca  { background: #d94b3f; color: #fff; }
        .threat-ignorar { background: #5e5d5d; color: #fff; }
        .threat-hidden  { display: none; }

        .empty { opacity: 0.35; }
    </style>
</head>

<body>
    <div class="pilot-widget">

        <div class="pilot-card nlt-card-soft ahead-card" id="aheadCard">
            <div class="pilot-card-main">
                <span class="direction">▲</span>
                <span class="position" id="aheadPosition">-</span>
                <span class="car-number" id="aheadCarNumber">-</span>
                <span class="driver-name" id="aheadDriver">-</span>
                <span class="gap" id="aheadGap">-</span>
                <span class="class-highlight" id="aheadClass">-</span>
            </div>
            <div class="pilot-card-sub">
                <div class="sub-left">
                    <span class="lap-context" id="aheadLapContext">-</span>
                    <span class="pace-gap pace-neutral" id="aheadPaceGap">-</span>
                </div>
                <span class="threat-badge threat-hidden" id="aheadThreat"></span>
            </div>
        </div>

        <div class="pilot-card nlt-card-soft behind-card" id="behindCard">
            <div class="pilot-card-main">
                <span class="direction">▼</span>
                <span class="position" id="behindPosition">-</span>
                <span class="car-number" id="behindCarNumber">-</span>
                <span class="driver-name" id="behindDriver">-</span>
                <span class="gap" id="behindGap">-</span>
                <span class="class-highlight" id="behindClass">-</span>
            </div>
            <div class="pilot-card-sub">
                <div class="sub-left">
                    <span class="lap-context" id="behindLapContext">-</span>
                    <span class="pace-gap pace-neutral" id="behindPaceGap">-</span>
                </div>
                <span class="threat-badge threat-hidden" id="behindThreat"></span>
            </div>
        </div>

    </div>

    <script>
        const ENDPOINT = '/widgets/pilot/relative';
        const UPDATE_INTERVAL_MS = 500;
        const CLASS_STYLE_NAMES = ['hypercar', 'lmp2', 'lmp3', 'gt3'];

        const aheadFields = getCardElements('ahead');
        const behindFields = getCardElements('behind');

        async function loadRelative() {
            try {
                const response = await fetch(ENDPOINT);
                if (!response.ok) throw new Error('Falha ao buscar pilot-relative');
                const data = await response.json();
                updateCard(aheadFields, data.ahead);
                updateCard(behindFields, data.behind);
            } catch (error) {
                console.error('Erro pilot-relative:', error);
            }
        }

        function getCardElements(prefix) {
            return {
                card:       document.getElementById(prefix + 'Card'),
                position:   document.getElementById(prefix + 'Position'),
                carNumber:  document.getElementById(prefix + 'CarNumber'),
                driver:     document.getElementById(prefix + 'Driver'),
                gap:        document.getElementById(prefix + 'Gap'),
                carClass:   document.getElementById(prefix + 'Class'),
                lapContext: document.getElementById(prefix + 'LapContext'),
                paceGap:    document.getElementById(prefix + 'PaceGap'),
                threat:     document.getElementById(prefix + 'Threat')
            };
        }

        function updateCard(el, car) {
            if (!car) {
                el.card.classList.add('empty');
                setText(el.position, '-');
                setText(el.carNumber, '-');
                setText(el.driver, '-');
                setText(el.gap, '-');
                updateClass(el.carClass, '-');
                setText(el.lapContext, '-');
                updatePaceGap(el.paceGap, null);
                updateThreat(el.threat, null);
                return;
            }

            el.card.classList.remove('empty');
            setText(el.position, car.position ? 'P' + car.position : '-');
            setText(el.carNumber, car.carNumber ? '#' + car.carNumber : '-');
            setText(el.driver, car.driverName ?? '-');
            setText(el.gap, car.interval ?? '-');
            updateClass(el.carClass, car.carClass ?? '-');
            setText(el.lapContext, car.lapContext ?? '-');
            updatePaceGap(el.paceGap, car.paceGap ?? null);
            updateThreat(el.threat, car.threatStatus ?? null);
        }

        function normalizeClassName(carClass) {
            if (!carClass || carClass === '-') return carClass;
            const n = carClass.toLowerCase();
            if (n.includes('hyper')) return 'Hypercar';
            if (n.includes('lmp2'))  return 'LMP2';
            if (n.includes('lmp3'))  return 'LMP3';
            if (n.includes('gt3'))   return 'GT3';
            return carClass;
        }

        function updateClass(element, className) {
            element.classList.remove(...CLASS_STYLE_NAMES);

            if (!className || className === '-') {
                setText(element, '-');
                return;
            }

            setText(element, normalizeClassName(className));

            const n = className.toLowerCase();
            if (n.includes('hyper'))       element.classList.add('hypercar');
            else if (n.includes('lmp2'))   element.classList.add('lmp2');
            else if (n.includes('lmp3'))   element.classList.add('lmp3');
            else if (n.includes('gt3'))    element.classList.add('gt3');
        }

        function updatePaceGap(element, value) {
            element.classList.remove('pace-positive', 'pace-negative', 'pace-neutral');

            if (!value || value === '-') {
                setText(element, '-');
                element.classList.add('pace-neutral');
                return;
            }

            setText(element, 'ritmo ' + value);

            if (value.startsWith('+'))      element.classList.add('pace-positive');
            else if (value.startsWith('-')) element.classList.add('pace-negative');
            else                            element.classList.add('pace-neutral');
        }

        function updateThreat(element, status) {
            element.classList.remove('threat-alvo', 'threat-ameaca', 'threat-ignorar', 'threat-hidden');

            if (!status) {
                element.classList.add('threat-hidden');
                return;
            }

            setText(element, status);

            if (status === 'ALVO')        element.classList.add('threat-alvo');
            else if (status === 'AMEACA') element.classList.add('threat-ameaca');
            else if (status === 'IGNORAR') element.classList.add('threat-ignorar');
            else                           element.classList.add('threat-hidden');
        }

        function setText(element, value) {
            element.textContent = value;
        }

        loadRelative();
        setInterval(loadRelative, UPDATE_INTERVAL_MS);
    </script>
</body>
</html>
